name: Danmaku / APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danmaku-apk-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and test (no signing secrets)
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDanmaku :app:testDebugUnitTest
      - name: Collect APKs and build information
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t debug_apks < <(find app/build/outputs/apk/debug -type f -name '*.apk')
          mapfile -t release_apks < <(find app/build/outputs/apk/danmaku -type f -name '*-unsigned.apk')
          test "${#debug_apks[@]}" -eq 1
          test "${#release_apks[@]}" -eq 1
          cp "${debug_apks[0]}" dist/jellyfin-danmaku-debug.apk
          cp "${release_apks[0]}" dist/jellyfin-danmaku-unsigned.apk
          printf 'Commit: %s\nRun: %s\nDebug: temporary debug signature; installable for testing.\nDanmaku: unsigned; must be signed before installation.\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD_INFO.txt
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat dist/BUILD_INFO.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danmaku-apks-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: dist/
      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danmaku-tests-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/

  sign:
    name: Sign APK (master only)
    needs: build
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.config.outputs.enabled }}
    timeout-minutes: 10
    # A fresh runner, no checkout and no Gradle execution with signing credentials.
    steps:
      - name: Check optional signing configuration
        id: config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -n "${!name}" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" -eq 0 ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing not configured. Debug and unsigned APKs are available in the build artifact; see DANMAKU.md for the four signing secrets.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$count" -ne 4 ]]; then
            echo '::error::Signing is partially configured. All four ANDROID_* signing secrets are required.'
            exit 1
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download this run only
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: danmaku-apks-${{ github.sha }}
          path: input
      - name: Setup Java
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Align, sign and verify APK
        if: ${{ steps.config.outputs.enabled == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/danmaku-signing.jks"
          aligned="$RUNNER_TEMP/danmaku-aligned.apk"
          trap 'rm -f "$keyfile" "$aligned"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tools/apksigner"
          mkdir -p signed
          "$tools/zipalign" -P 16 -f 4 input/jellyfin-danmaku-unsigned.apk "$aligned"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false --out signed/jellyfin-danmaku-signed.apk "$aligned"
          "$tools/apksigner" verify --verbose --print-certs signed/jellyfin-danmaku-signed.apk > signed/SIGNATURE.txt
          cp input/BUILD_INFO.txt signed/BUILD_INFO.txt
          printf '\nSigned with the configured persistent release key. Package: org.jellyfin.androidtv.danmaku\n' >> signed/BUILD_INFO.txt
          (cd signed && sha256sum *.apk > SHA256SUMS)
          echo 'Signed APK verified; download the danmaku-signed artifact.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed APK
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danmaku-signed-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: signed/

  release:
    name: Publish GitHub Release
    needs: [build, sign]
    if: ${{ always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref_type == 'branch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: danmaku-apks-${{ github.sha }}
          path: input

      - name: Download signed APK when available
        if: ${{ needs.sign.result == 'success' && needs.sign.outputs.signed == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: danmaku-signed-${{ github.sha }}
          path: signed

      - name: Prepare release metadata and assets
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          branch="$GITHUB_REF_NAME"
          safe_branch="$(printf '%s' "$branch" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          short_sha="${GITHUB_SHA:0:12}"

          if [[ "$branch" == "master" ]]; then
            tag="danmaku-${short_sha}"
            title="Jellyfin Android TV Danmaku ${short_sha}"
            prerelease=false
          else
            tag="danmaku-${safe_branch}-${short_sha}"
            title="Jellyfin Android TV Danmaku ${branch} (${short_sha})"
            prerelease=true
          fi

          mkdir -p release-assets
          cp input/jellyfin-danmaku-debug.apk release-assets/
          cp input/jellyfin-danmaku-unsigned.apk release-assets/
          cp input/BUILD_INFO.txt release-assets/

          signed_note="Persistent release signing was not configured for this build."
          if [[ -f signed/jellyfin-danmaku-signed.apk ]]; then
            cp signed/jellyfin-danmaku-signed.apk release-assets/
            cp signed/SIGNATURE.txt release-assets/
            signed_note="Includes jellyfin-danmaku-signed.apk signed with the configured persistent release key."
          fi

          (
            cd release-assets
            sha256sum *.apk > SHA256SUMS
          )

          cat > release-assets/RELEASE_NOTES.md <<EOF
          Automated Android TV danmaku build.

          - Branch: `$branch`
          - Commit: `$GITHUB_SHA`
          - Workflow run: `$GITHUB_RUN_ID`
          - $signed_note

          `jellyfin-danmaku-debug.apk` is directly installable for testing but uses a CI debug signature.
          `jellyfin-danmaku-unsigned.apk` is optimized but cannot be installed until signed.
          EOF

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file release-assets/RELEASE_NOTES.md
          else
            args=(
              "$TAG"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "$TITLE"
              --notes-file release-assets/RELEASE_NOTES.md
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi

          gh release upload "$TAG" \
            release-assets/jellyfin-danmaku-debug.apk \
            release-assets/jellyfin-danmaku-unsigned.apk \
            release-assets/BUILD_INFO.txt \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          if [[ -f release-assets/jellyfin-danmaku-signed.apk ]]; then
            gh release upload "$TAG" \
              release-assets/jellyfin-danmaku-signed.apk \
              release-assets/SIGNATURE.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            echo "Published prerelease: $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          fi

